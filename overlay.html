<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerte Contexte</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  :root { --ok: #2f9e44; --warn: #f08c00; --bad: #e03131; --wood: #b07a45; --ink: #111; }

  #stage { position: fixed; inset: 0; pointer-events: none; }

  /* ---------- Le chef de chantier et sa pancarte ---------- */
  #actor { position: absolute; bottom: 0; width: 260px; height: 470px; display: none; }
  #actor.on { display: block; }
  #actor .flipper { position: absolute; inset: 0; }

  .sign { position: absolute; left: -48px; top: 0; width: 248px; transform-origin: 50% 100%; }
  .walking .sign { animation: signbob .32s ease-in-out infinite alternate; }
  @keyframes signbob { from { transform: rotate(-2deg) translateY(0); } to { transform: rotate(2deg) translateY(-5px); } }
  .angry .sign { animation: signshake .14s linear infinite; }
  @keyframes signshake { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .board {
    position: relative; background: #fffdf6; border: 4px solid var(--ink); border-radius: 14px;
    padding: 12px 14px 12px; box-shadow: 5px 5px 0 rgba(0, 0, 0, .85); text-align: center; color: var(--ink);
  }
  .lvl2 .board { border-color: var(--bad); box-shadow: 5px 5px 0 rgba(120, 0, 0, .9); }
  .board .proj { font: 800 14px/1.2 -apple-system, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .6px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board .label { font: 700 13px/1.2 "Chalkboard SE", "Marker Felt", "Comic Sans MS", cursive; margin-top: 4px; }
  .board .pct { font: 900 52px/1 Impact, "Arial Black", system-ui; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: 22px; border: 3px solid var(--ink); border-radius: 8px; background: #eee; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ok); transition: background .3s; }
  .bar .mark { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 3px dashed var(--ink); opacity: .55; }
  .board .tok { font: 600 12px/1.3 -apple-system, system-ui, sans-serif; color: #555; margin-top: 7px; font-variant-numeric: tabular-nums; }
  .stick { position: absolute; left: 69px; top: 0; width: 14px; background: var(--wood); border: 3px solid var(--ink); border-radius: 4px; }

  .man { position: absolute; left: 40px; bottom: 0; width: 180px; height: 240px; }
  .man svg { display: block; overflow: visible; filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff); }
  .legs line { transform-box: view-box; transform-origin: 100px 170px; }
  .walking .legA { animation: run .32s ease-in-out infinite alternate; }
  .walking .legB { animation: run .32s ease-in-out infinite alternate-reverse; }
  .walking .torso { animation: bob .32s infinite alternate; }
  @keyframes run { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  @keyframes bob { to { transform: translateY(-5px); } }
  .angry .torso, .angry .legs { animation: stomp .28s ease-in-out 3; }
  @keyframes stomp { 50% { transform: translateY(-14px); } }
  .mOpen, .mHappy { display: none; }
  .talk .mOpen { display: inline; }
  .talk .mShut { display: none; }
  .brows2 { display: none; }
  .lvl2 .brows2 { display: inline; }
  .lvl2 .brows1 { display: none; }

  /* ---------- Bulle de BD ---------- */
  .bubble {
    position: absolute; z-index: 6; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 22px;
    padding: 10px 16px 11px; font: 700 21px/1.2 "Chalkboard SE", "Marker Felt", "Comic Sans MS", cursive;
    width: max-content; max-width: 330px; box-shadow: 5px 5px 0 rgba(0, 0, 0, .85);
    transform-origin: 100% 70%; animation: pop .26s cubic-bezier(.3, 1.7, .5, 1);
  }
  .bubble code { font: 800 .95em ui-monospace, Menlo, monospace; background: #ffe14d; padding: 1px 6px; border-radius: 6px; border: 2px solid var(--ink); }
  .bubble::before, .bubble::after { content: ""; position: absolute; border-style: solid; }
  .bubble::before { left: 100%; top: 26px; border-width: 12px 0 12px 22px; border-color: transparent transparent transparent var(--ink); }
  .bubble::after { left: calc(100% - 4px); top: 30px; border-width: 8px 0 8px 16px; border-color: transparent transparent transparent #fff; }
  .bubble.out { opacity: 0; transform: scale(.85); transition: .2s; }
  @keyframes pop { from { transform: scale(0) rotate(-4deg); } }

  /* ---------- Aperçu navigateur (?preview) ---------- */
  #preview { display: none; }
  body.preview { background: #f5f4ef; }
  body.preview #preview { display: block; position: fixed; inset: 0; padding: 70px 10vw 0; font: 16px/1.6 -apple-system, system-ui, sans-serif; color: #333; }
  #preview .btns { display: flex; gap: 10px; margin-top: 18px; pointer-events: auto; flex-wrap: wrap; }
  #preview button { font: 700 15px -apple-system, system-ui, sans-serif; padding: 11px 16px; border-radius: 10px; border: 0; background: #1f1e1c; color: #fff; cursor: pointer; }
  #preview button.alt { background: var(--bad); }
</style>
</head>
<body>
<div id="preview">
  <p><b>Alerte Contexte</b>, démo. Quand une conversation avec Claude devient trop lourde, un chef de chantier passe avec sa pancarte.</p>
  <div class="btns">
    <button id="b1">▶ Alerte à 72 %</button>
    <button id="b2" class="alt">▶ Deuxième alerte (86 %)</button>
  </div>
</div>

<div id="stage">
  <div id="actor">
    <div class="flipper">
      <div class="sign">
        <div class="board">
          <div class="proj"></div>
          <div class="label">Contexte utilisé</div>
          <div class="pct">0 %</div>
          <div class="bar"><i></i><span class="mark"></span></div>
          <div class="tok"></div>
        </div>
      </div>
      <div class="stick"></div>
      <div class="man"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const actor = $('#actor'), board = actor.querySelector('.board');
  const projEl = actor.querySelector('.proj'), pctEl = actor.querySelector('.pct'), barEl = actor.querySelector('.bar i');
  const markEl = actor.querySelector('.bar .mark'), tokEl = actor.querySelector('.tok');
  const signEl = actor.querySelector('.sign'), stickEl = actor.querySelector('.stick'), manEl = actor.querySelector('.man');
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const W = () => innerWidth;
  const fmt = (n) => Math.round(n).toLocaleString('fr-FR');

  const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.alerte;
  const post = (type, value) => { try { if (bridge) bridge.postMessage({ type, value: String(value) }); } catch (e) {} };

  /* ----- Sons : joués par l'app, ou par le navigateur en aperçu ----- */
  let ctx = null;
  function webSound(name) {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      const t = ctx.currentTime, out = ctx.createGain(); out.gain.value = .35; out.connect(ctx.destination);
      const tone = (f0, f1, start, dur, type = 'sine', vib = 0) => {
        const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
        o.frequency.setValueAtTime(f0, t + start); o.frequency.exponentialRampToValueAtTime(f1, t + start + dur);
        if (vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = vib; lg.gain.value = 120; l.connect(lg).connect(o.frequency); l.start(t + start); l.stop(t + start + dur); }
        g.gain.setValueAtTime(0.0001, t + start); g.gain.exponentialRampToValueAtTime(1, t + start + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
        o.connect(g).connect(out); o.start(t + start); o.stop(t + start + dur + .05);
      };
      if (name === 'pop') tone(420, 900, 0, .12);
      else if (name === 'whistle') { tone(2600, 2500, 0, .22, 'sine', 32); tone(2600, 2500, .3, .45, 'sine', 32); }
      else if (name === 'tick') tone(1500, 1400, 0, .03, 'square');
    } catch (e) {}
  }
  const sfx = (name) => (bridge ? post('sfx', name) : webSound(name));

  /* ----- Le chef de chantier (casque jaune, gilet orange) ----- */
  const MAN = `<svg viewBox="0 0 200 270" width="180" height="243">
    <g stroke="#111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g class="legs"><line class="legA" x1="100" y1="170" x2="74" y2="262"/><line class="legB" x1="100" y1="170" x2="126" y2="262"/></g>
      <g class="torso">
        <path d="M84 92 L116 92 L120 150 L80 150 Z" fill="#ff8c1a" stroke-width="5"/>
        <line x1="86" y1="118" x2="114" y2="118" stroke="#fff" stroke-width="5"/>
        <line x1="100" y1="80" x2="100" y2="170"/>
        <line x1="100" y1="98" x2="50" y2="94"/><line x1="100" y1="104" x2="50" y2="132"/>
        <circle cx="44" cy="94" r="9" fill="#fff" stroke-width="5"/><circle cx="44" cy="132" r="9" fill="#fff" stroke-width="5"/>
      </g>
    </g></svg>`;
  // La tête est dessinée à part pour passer devant le bâton
  const HEAD = `<svg viewBox="0 0 200 270" width="180" height="243" style="position:absolute;left:0;top:0">
    <g stroke="#111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" class="torso">
      <circle cx="100" cy="62" r="30" fill="#fff"/>
      <path d="M68 52 Q70 22 100 22 Q130 22 132 52 Z" fill="#ffd43b" stroke-width="6"/>
      <line x1="62" y1="52" x2="138" y2="52" stroke-width="7"/>
      <line x1="100" y1="24" x2="100" y2="46" stroke-width="4"/>
      <g class="brows1" stroke-width="4"><line x1="84" y1="60" x2="94" y2="60"/><line x1="106" y1="60" x2="116" y2="60"/></g>
      <g class="brows2" stroke-width="4"><line x1="82" y1="57" x2="95" y2="63"/><line x1="118" y1="57" x2="105" y2="63"/></g>
      <circle cx="90" cy="68" r="3.5" fill="#111" stroke="none"/><circle cx="110" cy="68" r="3.5" fill="#111" stroke="none"/>
      <path class="mShut" d="M90 81 Q100 77 110 81" stroke-width="4"/>
      <ellipse class="mOpen" cx="100" cy="81" rx="8" ry="6" fill="#111" stroke-width="3"/>
    </g></svg>`;
  manEl.innerHTML = MAN + HEAD;

  // Bâton : du bas de la pancarte jusqu'aux mains
  function layout() {
    const signH = signEl.offsetHeight;
    const lowHandY = actor.offsetHeight - 243 + 132 * (243 / 270);
    stickEl.style.top = (signH - 6) + 'px';
    stickEl.style.height = Math.max(20, lowHandY + 34 - signH) + 'px';
  }

  let bubble = null;
  function say(html, ms = 2400) {
    if (bubble) bubble.remove();
    const b = bubble = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = html;
    actor.appendChild(b);
    b.style.right = (actor.offsetWidth + 48 + 14) + 'px';
    b.style.top = (signEl.offsetHeight * .35) + 'px';
    actor.classList.add('talk');
    setTimeout(() => { actor.classList.remove('talk'); b.classList.add('out'); }, ms);
    setTimeout(() => { b.remove(); if (bubble === b) bubble = null; }, ms + 250);
  }

  // Vert sous le seuil d'alerte, orange au-dessus, rouge à la deuxième alerte.
  let curTh = 70, curLvl2 = false;
  function color(p) { return p < curTh ? 'var(--ok)' : curLvl2 ? 'var(--bad)' : 'var(--warn)'; }

  async function fill(pct) {
    const steps = 24;
    for (let i = 1; i <= steps; i++) {
      const p = pct * i / steps;
      barEl.style.width = Math.min(100, p) + '%';
      barEl.style.background = color(p);
      pctEl.textContent = Math.round(p) + ' %';
      pctEl.style.color = color(p);
      if (i % 3 === 0) sfx('tick');
      await wait(36);
    }
  }

  let busy = false;
  async function show(ev) {
    if (busy) return;
    busy = true;
    const pct = Math.max(1, Math.min(100, Math.round(ev.pct)));
    const lvl2 = ev.level >= 2;
    curTh = Math.min(100, ev.threshold || 50); curLvl2 = lvl2;
    projEl.textContent = ev.title || 'Cette conversation';
    tokEl.textContent = `${fmt(ev.tokens)} tokens sur ${fmt(ev.window)}`;
    markEl.style.left = Math.min(100, ev.threshold || 50) + '%';
    barEl.style.width = '0'; pctEl.textContent = '0 %'; pctEl.style.color = '';
    actor.className = 'on' + (lvl2 ? ' lvl2' : '');
    layout();

    const target = W() - actor.offsetWidth - 34;
    actor.style.transition = 'none';
    actor.style.left = (W() + 30) + 'px';
    void actor.offsetWidth;
    actor.classList.add('walking');
    actor.style.transition = 'left 1.5s cubic-bezier(.25,.7,.35,1)';
    actor.style.left = target + 'px';
    await wait(1500);
    actor.classList.remove('walking');

    sfx('pop');
    await fill(pct);
    sfx('whistle');
    if (lvl2) {
      actor.classList.add('angry');
      say(pick(['Là, ça devient lourd !', 'Stop ! Ta conversation déborde !', 'Deuxième avertissement !']) + `<br>Contexte à ${pct} %.`, 2600);
      await wait(2800);
      actor.classList.remove('angry');
      say('Compacte maintenant :<br>tape <code>/compact</code>', 2800);
      await wait(3000);
    } else {
      say(`Attention ! Ton contexte est à ${pct} %.`, 2400);
      await wait(2600);
      say('Pense à compacter :<br>tape <code>/compact</code>', 2800);
      await wait(3000);
    }

    actor.classList.add('walking');
    actor.style.transition = 'left 1.2s ease-in';
    actor.style.left = (W() + 40) + 'px';
    await wait(1250);
    actor.className = '';
    busy = false;
    post('done', '');
  }

  window.alerte = { show, isBusy: () => busy };

  if (location.search.includes('preview')) {
    document.body.classList.add('preview');
    $('#b1').onclick = () => show({ title: 'Plan de lancement', pct: 72, tokens: 144000, window: 200000, level: 1, threshold: 50 });
    $('#b2').onclick = () => show({ title: 'Plan de lancement', pct: 86, tokens: 172000, window: 200000, level: 2, threshold: 50 });
    if (location.search.includes('auto')) setTimeout(() => $('#b1').click(), 400);
  }
})();
</script>
</body>
</html>
